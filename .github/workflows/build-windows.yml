name: Build (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    name: windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build/ci -A x64
          -DJO_BUILD_HARNESS=ON

      - name: Build
        run: cmake --build build/ci --config Release

      - name: Verify binary
        run: >
          python tools/verify_binary.py
          build/ci/Release/JO-Launcher.exe

      - name: Collect artifacts
        shell: pwsh
        run: |
          $out = "artifacts/windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/ci/Release/JO-Launcher.exe $out
          if (Test-Path build/ci/Release/launch_harness.exe) {
            Copy-Item build/ci/Release/launch_harness.exe $out
          }
          Copy-Item LICENSE, NOTICE, PRIVACY.md $out
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: JO-Launcher-windows-x64
          path: artifacts/windows-x64/*
          if-no-files-found: error
